name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's merge commit and its first parent, the base, for the version check.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Compile mods into plugins/
        run: bun build.ts
      - name: plugins/ is up to date with mods/ and the pinned zen kit
        # New files too: `git diff` alone misses a compiled file that was never committed.
        run: |
          git status --porcelain -- plugins
          test -z "$(git status --porcelain -- plugins)"
      - name: A mod whose plugins/ output changed has a higher version
        # Marketplace installs only update when a mod's version changes, so a
        # change to a mod's compiled output without a bump never reaches them.
        # New mods (no plugin.json at the base) are skipped.
        if: github.event_name == 'pull_request'
        env:
          BASE: HEAD^1
          HEAD_REF: HEAD
        run: |
          status=0
          for dir in $(git ls-tree -d --name-only "$HEAD_REF" plugins/); do
            mod=${dir#plugins/}
            manifest="$dir/.claude-plugin/plugin.json"
            git cat-file -e "$BASE:$manifest" 2>/dev/null || continue
            git diff --quiet "$BASE" "$HEAD_REF" -- "$dir" && continue
            old=$(git show "$BASE:$manifest" | jq -r '.version')
            new=$(git show "$HEAD_REF:$manifest" | jq -r '.version')
            highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)
            if [ "$new" = "$old" ] || [ "$highest" != "$new" ]; then
              echo "::error file=mods/$mod/.claude-plugin/plugin.json::$mod changed under $dir/ but its version $new is not above the base's $old; raise it in mods/$mod/.claude-plugin/plugin.json and .claude-plugin/marketplace.json"
              status=1
            fi
          done
          exit $status

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.302
      - name: Validate each mod
        run: |
          for dir in plugins/*/; do
            claude plugin validate "$dir"
          done
      - name: Test each mod that has tests
        run: |
          for dir in plugins/*/; do
            if [ -n "$(find "$dir" \( -name '*.test.ts' -o -name '*.test.tsx' \) -print -quit)" ]; then
              claude plugin test "$dir"
            fi
          done

      - name: Validate the marketplace
        run: claude plugin validate .
      - name: marketplace.json lists every mod at its plugin.json version
        run: |
          status=0
          market=.claude-plugin/marketplace.json
          for name in $(jq -r '.plugins[].name' "$market"); do
            source=$(jq -r --arg n "$name" '.plugins[] | select(.name == $n) | .source' "$market")
            listed=$(jq -r --arg n "$name" '.plugins[] | select(.name == $n) | .version' "$market")
            actual=$(jq -r '.version' "$source/.claude-plugin/plugin.json")
            if [ "$listed" != "$actual" ]; then
              echo "::error file=$market::$name is $listed in marketplace.json but $actual in $source/.claude-plugin/plugin.json"
              status=1
            fi
          done
          for dir in plugins/*/; do
            name=$(jq -r '.name' "${dir}.claude-plugin/plugin.json")
            if ! jq -e --arg n "$name" '.plugins[] | select(.name == $n)' "$market" > /dev/null; then
              echo "::error file=$market::$name (${dir}) is not listed in marketplace.json"
              status=1
            fi
          done
          exit $status
