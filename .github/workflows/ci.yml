name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Compile mods into plugins/
        run: bun build.ts
      - name: plugins/ is up to date with mods/ and kit/
        run: git diff --exit-code -- plugins

      - name: Kit tests
        run: bun test kit

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Validate and test each mod
        run: |
          for dir in plugins/*/; do
            echo "::group::$dir"
            claude plugin validate "$dir"
            claude plugin test "$dir"
            echo "::endgroup::"
          done
